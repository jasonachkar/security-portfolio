http:
  routers:
    # Auth service
    auth-router:
      rule: "PathPrefix(`/api/auth`)"
      service: auth-service
      entryPoints:
        - web

    # Vulnerability scanner
    scans-router:
      rule: "PathPrefix(`/api/scans`)"
      service: vuln-scanner
      entryPoints:
        - web

    # Network analyzer
    network-router:
      rule: "PathPrefix(`/api/network`)"
      service: network-analyzer
      entryPoints:
        - web

    # Security assessment orchestrator
    assessments-router:
      rule: "PathPrefix(`/api/assessments`)"
      service: orchestrator
      entryPoints:
        - web

    # Threat intelligence service
    intel-router:
      rule: "PathPrefix(`/api/intel`)"
      service: threat-intel
      entryPoints:
        - web

    # Alert correlation service
    alerts-router:
      rule: "PathPrefix(`/api/alerts`) || PathPrefix(`/api/incidents`) || PathPrefix(`/api/correlation`)"
      service: alert-correlation
      entryPoints:
        - web

    # Compliance service
    compliance-router:
      rule: "PathPrefix(`/api/compliance`)"
      service: compliance
      entryPoints:
        - web

  services:
    auth-service:
      loadBalancer:
        servers:
          - url: "http://auth-service:8083"

    vuln-scanner:
      loadBalancer:
        servers:
          - url: "http://vuln-scanner:8080"

    network-analyzer:
      loadBalancer:
        servers:
          - url: "http://network-analyzer:8081"

    orchestrator:
      loadBalancer:
        servers:
          - url: "http://orchestrator:8082"

    threat-intel:
      loadBalancer:
        servers:
          - url: "http://threat-intel:8084"

    alert-correlation:
      loadBalancer:
        servers:
          - url: "http://alert-correlation:8085"

    compliance:
      loadBalancer:
        servers:
          - url: "http://compliance:8086"

  middlewares:
    cors-headers:
      headers:
        accessControlAllowOriginList:
          - "http://localhost:3000"
          - "http://localhost:5173"
          - "http://localhost"
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "*"
        accessControlAllowCredentials: true
