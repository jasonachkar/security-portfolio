app = "jason-network-analyzer"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "cloud-demo"
  PORT = "8081"
  CAPTURE_INTERFACE = "replay"
  CAPTURE_BPF = ""

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
