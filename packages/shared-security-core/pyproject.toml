[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shared-security-core"
version = "0.1.0"
description = "Shared security platform core utilities and models"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi==0.115.8",
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "pyjwt==2.10.1",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",
    "boto3==1.37.0",
    "botocore==1.37.0",
    "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "black==24.10.0",
    "ruff==0.8.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shared_security_core"]
