version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "9083:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: .
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: postgresql://auth_user:auth_pass@postgres:5432/auth_db
      APP_ENV: local
      LOG_LEVEL: INFO
      JWT_SECRET: dev-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: uvicorn auth_service.api.main:app --host 0.0.0.0 --port 8083 --reload

volumes:
  auth_postgres_data:
