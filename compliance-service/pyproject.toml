[project]
name = "compliance-service"
version = "0.1.0"
description = "Compliance framework mapping and reporting service"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.8",
    "uvicorn==0.30.6",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg==3.2.3",
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    "httpx==0.27.2",
    "reportlab==4.2.5",
    "structlog==24.4.0",
    "python-json-logger==2.0.7",
    "shared-security-core @ file:///app/shared-security-core",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
